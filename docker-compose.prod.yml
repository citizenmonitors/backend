# Production-oriented stack: TypeScript image, nginx edge, Redis (REDIS_URL), optional local MongoDB.
#
# App + nginx + Redis (use Atlas/cloud DB via .env: MONGODB_URI_PROD or MONGODB_URI):
#   docker compose -f docker-compose.prod.yml --env-file .env up -d
#
# Same stack + MongoDB in compose:
#   docker compose -f docker-compose.prod.yml --profile with-mongo --env-file .env up -d
#
# For local DB without Atlas, set e.g. NODE_ENV=development and MONGODB_URI=mongodb://mongo:27017/citizenmonitorsdb

services:
  app:
    build: .
    ports:
      - "5050:5050"
    env_file:
      - .env
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=5050
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped
    volumes:
      - observer-uploads:/usr/src/app/dist/observerId
      - profile-uploads:/usr/src/app/dist/profileImage
      - elections-media:/usr/src/app/dist/electionsData

  mongo:
    profiles: ["with-mongo"]
    image: mongo:6
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_started
    networks:
      - app-network
    restart: unless-stopped

volumes:
  mongo-data:
  observer-uploads:
  profile-uploads:
  elections-media:

networks:
  app-network:
    driver: bridge
