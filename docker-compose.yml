version: '3'
services:
  app:
    build: .
    ports:
      - "5040:5040"
    env_file:
      - .env
    depends_on:
      - mongo
    environment:
      - MONGO_URL=mongodb://mongo:27017/citizenmonitorsdb
  mongo:
    image: mongo:6
    restart: always
    ports:
      - "27018:27017"
    volumes:
      - mongo-data:/data/db
volumes:
  mongo-data: 