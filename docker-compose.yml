services:
  app:
    build: .
    ports:
      - "5050:5050"
    env_file:
      - .env
    depends_on:
      - mongo
    environment:
      - MONGO_URL=mongodb://mongo:27017/citizenmonitorsdb
    networks:
      - app-network

  mongo:
    image: mongo:6
    restart: always
    ports:
      - "27018:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - app-network

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - app-network
    restart: always

volumes:
  mongo-data:

networks:
  app-network:
    driver: bridge 