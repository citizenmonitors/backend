services:
  app:
    build: .
    ports:
      - "5050:5050"
    env_file:
      - .env
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      - NODE_ENV=development
      - PORT=5050
      - MONGODB_URI=mongodb://mongo:27017/citizenmonitorsdb
    networks:
      - app-network
    restart: unless-stopped

  mongo:
    image: mongo:6
    restart: always
    ports:
      - "27018:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_started
    networks:
      - app-network
    restart: always

volumes:
  mongo-data:

networks:
  app-network:
    driver: bridge 