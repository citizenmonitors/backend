services:
  - type: web
    name: citizen-monitors-backend
    env: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm run start:prod
    # Root directory - empty means root of repository (not "src")
    # This fixes the error: Could not read package.json: Error: ENOENT: no such file or directory, open '/opt/render/project/src/package.json'
    rootDir: ""
    envVars:
      - key: NODE_ENV
        value: production
      # PORT is automatically provided by Render, but we set default in server.js
      # MongoDB and other env vars should be set in Render dashboard

